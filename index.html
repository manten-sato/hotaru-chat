
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>まんてんちゃんQ&A</title>

<style>
body{
  font-family: sans-serif;
  background:#eef2f5;
}

#chatBox{
  width:850px;
  height:250px;
  border:2px solid #333;
  background:white;
  padding:10px;
  overflow-y:auto;
  margin-bottom:10px;
}

.message{
  display:flex;
  align-items:flex-start;
  margin-bottom:12px;
}

.icon{
  width:60px;
  margin-right:10px;
}

.icon img{
  width:60px;
}

.text{
  background:#f4f4f4;
  padding:10px;
  border-radius:8px;
  max-width:550px;
}

.user .text{
  background:#d7ecff;
}

input{
  width:550px;
  padding:6px;
}
</style>
</head>

<body>

<h2>まんてんちゃんQ&A</h2>

<div id="chatBox"></div>

<input type="text" id="userInput" placeholder="メッセージを入力">
<button onclick="reply()">送信</button>

<script>
function addMessage(text, sender){

  const chat = document.getElementById("chatBox");

  const messageDiv = document.createElement("div");
  messageDiv.className = "message " + sender;

  const iconDiv = document.createElement("div");
  iconDiv.className = "icon";

  const img = document.createElement("img");

  if(sender === "bot"){
    img.src = "アイコン.png";
  }else{
    img.src = "https://cdn-icons-png.flaticon.com/512/1946/1946429.png";
  }

  iconDiv.appendChild(img);

  const textDiv = document.createElement("div");
  textDiv.className = "text";
  textDiv.innerText = text;

  messageDiv.appendChild(iconDiv);
  messageDiv.appendChild(textDiv);

  chat.appendChild(messageDiv);
  chat.scrollTop = chat.scrollHeight;
}

function reply(){
 const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user");

  let response = "";

  // 小文字化して判定安定化
  const t = text;

  // 桂泉会
  if(t.includes("桂泉会") || t.includes("理念")){
    response = "私たちは、地域に開かれた、地域に愛される、地域に信頼される施設を目指します";
  }

  // 事業者
  if(t.includes("事業者") || t.includes("法人")){
    response = "事業者は社会福祉法人 桂泉会です。所在地は岩手県二戸市金田一字上田面301番地1、電話番号は0195-34-3100です。";
  }

  // 代表者
  else if(t.includes("代表") || t.includes("理事長")){
    response = "代表者は理事長 佐藤義輝です。";
  }

  // 所在地
  else if(t.includes("場所") || t.includes("所在地") || t.includes("どこ")){
    response = "所在地は岩手県二戸市金田一字八ッ長40番地1です。";
  }

  // 職員
  else if(t.includes("職員") || t.includes("スタッフ")){
    response = "職員は管理者1名、サービス管理責任者1名、生活支援員1名、世話人3名です。";
  } 
  
  // 定員
  else if(t.includes("定員") || t.includes("何人")){
    response = "定員は20名で、1号棟10名・2号棟10名となっています。";
  }

  // 開設
  else if(t.includes("開設") || t.includes("いつから")){
    response = "開設は平成22年4月1日です。";
  }

  // 面会
  else if(t.includes("面会")){
    response = "面会時間は原則9:00～20:00です。面会簿へのご記入をお願いしています。";
  }

  // 門限
  else if(t.includes("門限") || t.includes("外出")){
    response = "外出・外泊は事前の届出制で、門限は21:00です。";
  }

  // 食事
  else if(t.includes("食事") || t.includes("ごはん")){
    response = "食事は1日2食で、朝食は7:00～8:00、夕食は18:00～19:00です。";
  }

  // 入浴
  else if(t.includes("風呂") || t.includes("入浴")){
    response = "入浴時間は16:00～21:00となっています。";
  }

　// 利用条件
　else if(t.includes("利用条件") || t.includes("入居条件") || t.includes("対象") || t.includes("利用できる人") || t.includes("入れる人")){
　  response = "当ホームの利用対象は、障害支援区分の認定を受けている方で、共同生活が可能な方となります。詳細は個別にご相談ください。";
　}

   // 利用方法
else if(t.includes("利用者") || t.includes("利用方法") || t.includes("申し込み") || t.includes("申込") || t.includes("手続き") || t.includes("どうやって利用") || t.includes("利用するには") || t.includes("どんな人") || t.includes("どのような人") || t.includes("対象者") || t.includes("利用できる人") || t.includes("入れる人")){
  response = "身体障がい・知的障がい・精神障がいのある方で、日常生活においてある程度身の回りのことができ、共同生活が可能な方が対象となります。また、グループホームの利用には、市町村が発行する『障害福祉サービス受給者証』が必要です。まずはお住まいの市町村窓口へご相談いただき、受給者証の申請手続きを行ってください。その後、見学・面談を経て利用開始となります。";
}
  
  // 料金
  else if(t.includes("料金") ||(t.includes("家賃")|| t.includes("費用") || t.includes("いくら") || t.includes("利用料")){
    response = "月額の目安は、食材料費20,000円、水道光熱費12,000円、家賃25,000円、消耗品費3,000円です。10,000円の家賃助成があり、実質月額は50,000円となります。";
  }

  // 支払い
  else if(t.includes("支払い") || t.includes("払")){
    response = "お支払いは現金・振込・自動引落しが可能で、翌々月1日までにお願いしています。";
  }

  // 苦情
  else if(t.includes("苦情") || t.includes("相談")){
    response = "苦情やご相談は月～金曜日の9:00～17:00に受付しています。担当はサービス管理責任者です。";
  }

  // 緊急
  else if(t.includes("緊急") || t.includes("事故") || t.includes("病気")){
    response = "緊急時には速やかに医療機関へ連絡し、ご家族へもご報告いたします。";
  }

  // 個人情報
  else if(t.includes("個人情報")){
    response = "個人情報はサービス提供に必要な範囲で適切に管理し、正当な理由なく第三者へ開示することはありません。";
  }

  // 防災
  else if(t.includes("防災") || t.includes("災害") || t.includes("避難")){
    response = "防災計画を策定し、昼夜を想定した避難訓練を実施しています。スプリンクラー等の設備も整備されています。";
  }
　// 施設・設備について
else if(t.includes("どんな施設") || t.includes("どのような施設") || t.includes("設備") || t.includes("バリアフリー") || t.includes("車いす") || t.includes("wifi") || t.includes("Wi-Fi") || t.includes("インターネット") || t.includes("居室") || t.includes("個室") || t.includes("共用")){
  response = "当ホームはバリアフリー対応で、車いすでの利用も可能です。居室はすべて個室で、各居室に冷暖房を完備しています。Wi-Fi（無線インターネット環境）も整備しています。共用スペースには食堂・浴室・洗濯室があり、各棟に洗濯機2台・乾燥機2台を設置しています。また、各居室および共用スペースにはスプリンクラーを完備し、防災面にも配慮しています。";
}
  // 該当なし
  else{
    response = "申し訳ありません。その内容については職員までお問い合わせください。";
　}
    addMessage(response,"bot");
  input.value = "";
}
</script>

</body>
</html>
